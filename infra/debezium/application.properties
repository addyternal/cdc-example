# Debezium Server: Postgres (pgoutput) -> Redis Streams
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=1000

debezium.source.database.hostname=source-db
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium_pw
debezium.source.database.dbname=shop

# Streams are named <topic.prefix>.<schema>.<table>, e.g. cdc.public.accounts
debezium.source.topic.prefix=cdc
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=cdc_slot
debezium.source.publication.name=cdc_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.accounts,public.products,public.orders,public.order_items
debezium.source.snapshot.mode=initial

# Deletes are just op=d events with a before image; no Kafka-style tombstones.
debezium.source.tombstones.on.delete=false

# Actor capture: pg_logical_emit_message('audit', ...) inside each transaction.
debezium.source.message.prefix.include.list=audit

# Keep the slot advancing while the app is idle.
debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.action.query=UPDATE heartbeat SET ts = now() WHERE id = 1

# Plain JSON envelopes (no embedded Connect schema).
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
debezium.source.decimal.handling.mode=string
debezium.source.time.precision.mode=connect

quarkus.log.level=INFO
